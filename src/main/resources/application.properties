spring.application.name=reprogramacion-api
server.port=${PORT:8080}

# Base de datos (en local usa los valores por defecto; en Railway vienen de variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reprogramacion_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Root1234!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:PROYECTODESARROLLOWEBINTEGRADO_111222333444555666777888999}
app.jwt.expiration-ms=86400000

# CORS: lista separada por comas
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Datos de prueba (usuarios con clave 123456)
app.seed.enabled=${SEED_ENABLED:true}

# Horario: tope de horas semanales que un alumno puede marcar como ocupadas
app.disponibilidad.max-horas-ocupadas-alumno=20